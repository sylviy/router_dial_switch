# perf.example.yaml —— WAN 性能矩阵的配置模板(**全局那一份**)。
#
# ⚠ 一般不需要动这个文件。台架上有好几台被测机,每台的接线不一样,
#   一个全局配置意味着换机就得重改一遍、改错了还看不出来。所以现在是
#   **一台机一份**:perf_configs/<型号脚本名>.yaml —— 在 start.bat 里选到
#   哪台就自动用哪份,没有的话它会问你要不要生成一份带注释的模板。
#   见 perf_configs/README.md。
#
#   这个文件(以及你复制出来的 perf.yaml)仍然有效,作为没有按型号配时的
#   回落,已经配好的台架不用动。优先级:
#     --config <路径> > perf_configs/<型号>.yaml > perf.yaml > 本文件
#
# 描述的是"测什么、怎么测";密码(管理密码/宽带账密)不在这里,
# 走 router.yaml(python start.py --setup)。
#
# 任何一项都可省略,省了就用内置默认;**没有 perf.yaml 也能直接跑**
# (python run_matrix.py --model <型号> = 遍历该型号的全部拨号方式)。
# 想先看样例报告:python run_matrix.py --demo
#
# 台架语义:整轮里每档切换都**真正下发**(没有 --apply 开关)——
# 不下发,吞吐测的就不是这档模式。

# 驱动哪台机:models/<名字>.py 的文件名(去掉 .py)。命令行 --model 会覆盖它。
model: Tenda_AX3000

# 性能后端:
#   simulate  离线模拟(无需 Chariot / 路由器,给演示、CI、看报告长啥样)
#   chariot   真台架(子进程调用 matrix/chariot_perf.py,需 PyChariot 环境)
backend: simulate

# 测试矩阵 --------------------------------------------------------------------
# **默认(不写 dial_modes)= 自动遍历该型号脚本声明的全部拨号方式**,按脚本
# 里的声明顺序 —— 这就是工具的本意,一般不用写。
# 只有想"只测其中几档 / 换顺序 / 给某档单独塞参数"时才展开写:
#   mode   必须是该型号脚本声明过的模式(如 Tenda: dynamic/pppoe/static/
#          dhcpv6/pppoev6 —— v6 精确到 flavor,没有笼统的 "ipv6")
#   params 该档需要的账密/服务器;不写 = 按模式从 router.yaml 的 params: 取
# dial_modes:
#   - mode: dynamic
#   - mode: pppoe
#     params: {pppoe_user: pppoe, pppoe_pass: pppoe}
#   - mode: l2tp
#     params: {vpn_server: 192.168.202.254, vpn_user: l2tp, vpn_pass: l2tp}

bands:      [lan, 2GHz]        # lan / 2GHz / 5GHz
directions: [up, down, bi]     # 上行 / 下行 / 双向
# TCP / UDP / TCP6 / UDP6,后面可加 -nofrag:
#   UDP          发送缓冲用 Throughput 脚本的默认值 —— 也就是**分片**那一档
#   UDP-nofrag   按下面 chariot.nofrag_bytes 里该拨号方式的 MTU 设缓冲,不分片
# 两个写在一起就是同一轮里既测分片又测不分片,报告的"协议"列自然分开两行。
protocols:  [TCP]

# 切完一档模式后,等 WAN 拨通再开测 ------------------------------------------
wan_up:
  method: ping                 # ping = ping 通 host 再测;wait = 只固定等待
  host: 192.168.202.99         # 默认 ping 谁(台架公网口)
  # 按模式覆盖 host —— 直连档和隧道档的对端在不同网段:dynamic/static 走
  # 公网口,拨号档拨通后拿到的是隧道网段、要打内网口。不分模式的话,那几档
  # 会白等满 timeout_s 再测(不会失败,但一档浪费一分钟)。
  hosts:
    dynamic: 192.168.202.99
    pppoe:   192.168.203.1
    l2tp:    192.168.203.1
    pptp:    192.168.203.1
  timeout_s: 60
  settle_s: 15                 # 拨通后再稳一会儿(旧脚本固定睡 15s)

# 全部跑完后切回的安全模式(可选;旧脚本收尾切回 dynamic)
reset_mode: dynamic

# Chariot 后端参数(backend=simulate 时全部忽略)------------------------------
# 逐项对应旧 Dial.py 里那些写死的常量,现在挪到配置里。
chariot:
  duration_s: 20
  internet_ip: 192.168.203.1   # 内网口对端(pppoe/l2tp/pptp 的 internet 组合走这)
  public_ip:   192.168.202.99  # 公网口对端(dynamic/static/含 public 的组合走这)
  # 按档**写死**对端,不写的档才回落到上面那条"从模式名字猜路"的规则。
  # 猜错不会报错,只会给一份打错了口、数字却很正常的报告 —— 名字不含
  # dynamic/static/public 的档(如日本 IPoE 的 transix / v6plus /
  # ocnvc / v6connect,它们其实是原生直连)必须写在这里。
  # e2_ip:
  #   v6plus: 192.168.202.66
  endpoints:                   # 客户端侧注入机,按频段
    lan:  192.168.0.79
    2GHz: 192.168.0.132
    5GHz: 192.168.0.132
  scripts:                     # 上行/下行各自的 Chariot 脚本
    up:   Throughput.scr
    down: Throughput_w2l.scr
  pairs: {TCP: 50, UDP: 100}   # 每种协议的对数(bi 时上下行各一半)
  # 只有 -nofrag 那档用:各拨号方式按自己的封装开销算出来的 MTU。
  # 没在这里配的模式,跑 -nofrag 会**报错**而不是随便挑个值 —— 猜错的话流量
  # 照样跑、数字照样漂亮,但其实分了片,一份标着"不分片"的分片数据最难发现。
  nofrag_bytes:
    dynamic: 1460
    static:  1460
    pppoe:   1440
    l2tp:    1383
    pptp:    1383
  stability_ratio: 0.9         # 中段采样 min < 0.9·max 判为"不稳"
  save_tests: true             # 保留 Chariot 的 .tst 原始记录(出争议时要翻它)。
                               # 落在 artifacts/wanperf_<型号>_<时间戳>_tst/,
                               # 和同一轮的 HTML/CSV 同名同戳,一眼对得上。
                               # 只要数字不要记录就写 false。
  # 跑 chariot_perf.py 的解释器。chariot_perf.py 本身 Py2/Py3 都能跑,这里
  # 只决定它跑在哪个 python 里 —— 唯一的要求是**那个 python 里 import
  # PyChariot 能成功**(开跑前 preflight 会替你验一次)。
  #   留空(默认)= 跟本工具同一个 python。日本 IPoE(v6プラス / transix /
  #                OCN バーチャルコネクト / v6 コネクト)那套 Python 3 拓扑
  #                就留空,不用配。
  #   老台架    = PyChariot 只装在 ActivePython 2.6.5 里,写它的绝对路径;
  #                那台机的 Playwright 要 3.8,两个 python 只能子进程隔开。
  # python: C:\Python26\python.exe
  python: ""                   # (旧键名 python2: 仍然认)

report:
  dir: artifacts               # HTML + CSV 写到哪
  title: WAN 性能矩阵
