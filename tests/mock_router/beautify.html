<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>Beautified hidden select (Xiaomi-style)</title>
<style>.hidden{display:none}</style></head>
<body>
  <!--
    Reproduces Xiaomi's "beautify" pattern: the REAL connection-type control is a
    native <select id="wantypeselect"> that is display:none, with a pretty widget
    drawn over it. find_dial_mode_select (visible-only) can't see it, so it must
    be pinned via selectors.dial_mode_select = "#wantypeselect" and driven with
    force select_option. The pretty <div> mirrors the select via a change
    listener, exactly like the real jQuery plugin.
  -->
  <div id="login">
    <input type="password" id="pw" placeholder="密码">
    <button id="loginBtn">登录</button>
  </div>
  <div id="app" class="hidden">
    <span id="wanNav">上网设置</span>
    <div id="wanPage" class="hidden">
      <select id="wantypeselect" name="wantypeselect" style="display:none">
        <option value="pppoe">PPPoE</option>
        <option value="dhcp">DHCP</option>
        <option value="static">静态IP</option>
      </select>
      <div id="pretty" class="ipt-text dummy">PPPoE</div>
    </div>
  </div>
  <script>
    document.getElementById('loginBtn').onclick = function () {
      document.getElementById('login').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    };
    document.getElementById('wanNav').onclick = function () {
      document.getElementById('wanPage').classList.remove('hidden');
    };
    // pretty widget mirrors the hidden select (like beautify's change handler)
    document.getElementById('wantypeselect').addEventListener('change', function (e) {
      document.getElementById('pretty').textContent =
        e.target.options[e.target.selectedIndex].textContent;
    });
  </script>
</body>
</html>
