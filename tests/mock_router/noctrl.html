<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>No real control (false-positive guard)</title>
<style>.hidden{display:none}</style></head>
<body>
  <!--
    Regression guard for a real false-positive: the WAN page shows the words
    "动态IP / DHCP / 自动获取" as DESCRIPTIVE TEXT, but there is NO real control
    (no <select>, no role=combobox, no radio input). The radio fallback's
    text-match used to latch onto this text, click it (a no-op), and -- because
    is_checked() throws on a non-radio -- report success:true having changed
    nothing. The engine must now report success:false + needs_recording here.
  -->
  <div id="login">
    <input type="password" id="pw" placeholder="密码">
    <button id="loginBtn">登录</button>
  </div>
  <div id="app" class="hidden">
    <span id="wanNav">上网设置</span>
    <div id="wanPage" class="hidden">
      <p id="desc">当前上网方式:动态IP(DHCP 自动获取),无需手动配置。</p>
    </div>
  </div>
  <script>
    document.getElementById('loginBtn').onclick = function () {
      document.getElementById('login').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    };
    document.getElementById('wanNav').onclick = function () {
      document.getElementById('wanPage').classList.remove('hidden');
    };
  </script>
</body>
</html>
