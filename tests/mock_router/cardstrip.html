<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock Router UI (card-strip / segmented connection type)</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  .hidden { display: none; }
  #topnav a { display:inline-block; padding:12px 20px; color:#0066cc; text-decoration:none; }
  #content { padding: 20px; }
  .form-item { margin: 12px 0; }
  .form-item__label { display:block; margin-bottom: 8px; font-weight: bold; }
  /* The dial control is a ROW OF CARDS, not a dropdown: no <select>, no
     role=combobox, no popup.  Selection is just an "active" CSS class on one
     card.  Every card's text reads as a dial mode -- which is exactly what
     makes the value-text widget heuristic mis-fire (it would grab the first
     card and call it the current value).  The engine must DECLINE this shape
     (needs_recording), not report a zero-click success. -->
  .mode-cards { display:flex; gap:10px; }
  .mode-card { border:1px solid #ccc; border-radius:6px; padding:14px 22px;
    cursor:pointer; background:#fff; user-select:none; }
  .mode-card.active { border-color:#0066cc; background:#eaf3ff; font-weight:bold; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-view">
  <h2>Router Login</h2>
  <div><input type="password" placeholder="Password"></div>
  <button>Log In</button>
</div>

<!-- APP -->
<div id="app-view" class="hidden">
  <div id="topnav">
    <a href="#" id="nav-status">Network Status</a>
    <a href="#" id="nav-wan">Internet Settings</a>
  </div>
  <div id="content">
    <div id="status-panel"><h3>Network Status</h3><p>Go to Internet Settings.</p></div>

    <div id="wan-panel" class="hidden">
      <h3>Internet Settings</h3>

      <div class="form-item">
        <div class="form-item__label">Internet Connection Type</div>
        <!-- 4 sibling cards under ONE parent, each showing a distinct mode.
             "Dynamic IP" is FIRST in document order; "Static IP" is the one
             pre-selected -- so a first-card false-success on mode=dynamic would
             be provably wrong. -->
        <div class="mode-cards" id="modeCards">
          <div class="mode-card" data-mode="dynamic">Dynamic IP</div>
          <div class="mode-card active" data-mode="static">Static IP</div>
          <div class="mode-card" data-mode="pppoe">PPPoE</div>
          <div class="mode-card" data-mode="l2tp">L2TP</div>
        </div>
      </div>

      <div class="form-item">
        <button id="saveBtn">Save</button>
        <span id="toast"></span>
      </div>
    </div>
  </div>
</div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  document.querySelector('#login-view button').onclick = function () {
    $('login-view').classList.add('hidden');
    $('app-view').classList.remove('hidden');
  };
  $('nav-wan').onclick = function (e) {
    e.preventDefault();
    $('status-panel').classList.add('hidden');
    $('wan-panel').classList.remove('hidden');
  };
  // clicking a card moves the "active" class -- the real selection mechanism.
  [].slice.call(document.querySelectorAll('#modeCards .mode-card')).forEach(function (c) {
    c.onclick = function () {
      [].slice.call(document.querySelectorAll('#modeCards .mode-card'))
        .forEach(function (x) { x.classList.remove('active'); });
      c.classList.add('active');
    };
  });
  $('saveBtn').onclick = function () {
    var active = document.querySelector('#modeCards .mode-card.active');
    $('toast').textContent = 'Saved: ' + (active ? active.textContent : '?');
  };
</script>
</body>
</html>
