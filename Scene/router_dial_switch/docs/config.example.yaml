# config.example.yaml —— 整个工具的**唯一**配置模板。
#
# 怎么用:把这个文件复制成 config.yaml,用记事本按下面的中文注释填一遍。
#   Windows:  copy config.example.yaml config.yaml
# 填不准也不要紧:每次开跑前工具都会核一遍,缺哪项就直接告诉你
# 「config.yaml 第 N 行:X 没填 —— 该填什么」,而且是在**碰路由器之前**报。
#
# 空字符串 "" 和 FILL_ME 都算「没填」。
# 只有这一个配置文件:旧的 router.yaml / perf.yaml / perf_configs/*.yaml
# 全部并进来了(哪一项去了哪一节,见 MIGRATION.md)。
#
# **换一台被测机要改的只有两处**:router.ip,和 run.dial_modes(这轮测哪几档)。
# 下面 bench 段的台架接线是按**拨号方式**走的 —— pppoe 拨通后对端就是那个
# 隧道网段,换哪台路由器都一样 —— 所以换机器不用动它。

# ===========================================================================
# router —— 被测路由器本身:管理地址、管理密码、各档要用的拨号账号
# ===========================================================================
router:
  # 路由器管理页地址。就是浏览器里打得开的那个,带不带 http:// 都行。
  # 台架上六台机的地址各不相同,换机器时改这一行。
  ip: 192.168.0.1

  # 路由器管理密码(登录 Web UI 用的那个)。留空 = 没填,开跑前会拦住。
  pass: ""

  # 宽带账号 / 密码:测 pppoe 档要用。台架发的那一对。
  # 不测 pppoe 就可以留空(只有真要切 pppoe 时才检查它)。
  pppoe_user: ""
  pppoe_pass: ""

  # PPTP / L2TP 各一套。**字段名一样但账号不同**,所以必须分开写 ——
  # 只写一层的话,后填的那套会把先填的覆盖掉。
  pptp:
    server: ""        # PPTP 服务器地址(台架给的那台)
    user: ""
    pass: ""
  l2tp:
    server: ""        # L2TP 服务器地址
    user: ""
    pass: ""

# ===========================================================================
# bench —— 台架接线:注入机、对端、Chariot 参数。跟被测机无关,换机器不用改。
#
# **除了开头两行浏览器路径,这一段只有整轮测吞吐(start.bat 菜单 3)
# 且 backend: chariot 时才用得到。** 只切拨号方式(菜单 1/2)一项都不读 ——
# 先验证切换的话,整段可以空着。
# ===========================================================================
bench:
  # 驱动哪个浏览器。两个都留空 = 用这台电脑上装着的 Chrome(台架的常态)。
  #   browser_path  Chrome/Chromium 可执行文件的绝对路径,例:
  #                 C:\Program Files\Google\Chrome\Application\chrome.exe
  #   browsers_dir  仓库自带的 Playwright 浏览器包目录,完全离线、连 Chrome
  #                 都没装的机器才填(vendor/ 里那份)。
  # 环境变量 ROUTER_BROWSER_PATH / ROUTER_BROWSERS_DIR 同样认。
  browser_path: ""
  browsers_dir: ""

  # 跑 Chariot 的解释器:装了 PyChariot 的那个 python 的**绝对路径**,
  # 例:C:\Python26\python.exe
  #
  # **所有机型测吞吐都用这一行**,不是只有 TPLink —— TPLink 是在这之外还拿
  # 它调 RouterCtrl。留空 = 用跑本工具的这个 python;台架上那就是
  # Vendor\python\python.exe(3.8),**里面没有 PyChariot**,整轮会在开跑前
  # 被拦住并让你回来填这一行。PyChariot 装在同一个 python 里的台架(日本
  # IPoE 那套是 Python 3)才留空。
  # 确认办法:<你写的那个 python> -c "import PyChariot; print('ok')"
  python2: ""

  # 注入机(Chariot 的 e1):接在被测机 LAN 口上、装了 Chariot Endpoint 的
  # 那台电脑的 IP。所有频段共用这一台时填它就够。
  injector_ip: ""

  # 各频段各有一台注入机时按频段写(盖过上面的 injector_ip)。
  # **键名要和 perf.bands 里写的一模一样**,大小写也是 —— 对不上的频段会被
  # 当成"没有注入机",开跑前拦住(以前是悄悄改用 lan 那台,于是测的是有线、
  # 报告上却写着 5GHz)。
  # 2GHz 和 5GHz 常常是同一台电脑的同一块网卡(换 SSID 连),写同一个 IP
  # 是正常的;lan 和无线写同一个 IP 基本是填错了。
  injectors:
    lan:  ""
    2GHz: ""
    5GHz: ""

  # 各档的**对端**(Chariot 的 e2)IP,按拨号方式写。
  # **别省着不写**:不写的档会回落到"名字里像直连就打 public_ip、
  # 否则打 internet_ip"那条猜路规则 —— 猜错不会报错,只会给你一份
  # 打错了口、数字却很正常的报告(日本 IPoE 四档就会被猜错)。
  #
  # 这里按档写,不按机器写:哪台路由器拨的 pppoe,对端都是同一个隧道网段。
  # 某台机才有的档(BUFFALO 的 transix / v6plus / ocnvc / v6connect)也一起
  # 写在这里,别的机器用不到它,多写无害。
  endpoints:
    dynamic: ""        # 直连侧,如 192.168.202.99
    pppoe:   ""        # 隧道侧,如 192.168.203.1
    pptp:    ""        # 隧道侧,同上
    l2tp:    ""        # 隧道侧,同上
    # transix:   192.168.202.66   # 只有 BUFFALO 有,而且是**原生直连**,
    # v6plus:    192.168.202.66   # 不写死会被名字猜成隧道档打错口

  # 上面 endpoints 没写到的档回落到这两个:直连侧 / 隧道侧。
  public_ip:   ""
  internet_ip: ""

  # 切完一档,ping 谁算「WAN 拨通了」。直连档和隧道档的对端在**不同网段**,
  # 所以按档写。不写的档用 wan_up_host;ping 不通不会判失败,只是白等满
  # perf.wan_up_timeout_sec 再开测(一档浪费一分钟)。
  wan_up_method: ping        # ping = 真去 ping;wait = 只固定等待
  wan_up_host: ""            # 没在下面按档写的,用这个
  wan_up_hosts:
    dynamic: ""
    pppoe:   ""
    pptp:    ""
    l2tp:    ""

  # --- 以下是 Chariot 自己的参数,台架配好一次就不用动 ---------------------
  scripts:                   # 上行 / 下行各用哪个 Chariot 脚本
    up:   Throughput.scr
    down: Throughput_w2l.scr
  pairs: {TCP: 50, UDP: 100} # 每种协议的对数(bi 时上下行各一半)
  # 只有 perf.protocols 里写了 UDP-nofrag 才用得到:各档按自己封装开销
  # 算出来的 MTU。没配的档会**直接报错**而不是随便挑一个 —— 猜错的话
  # 流量照跑、数字照出,一份标着"不分片"的分片数据最难发现。
  nofrag_bytes: {}
  stability_ratio: 0.9       # 中段采样 min < 0.9·max 就判为"不稳"
  save_tests: true           # 保留 Chariot 的 .tst 原始记录(出争议时要翻)

# ===========================================================================
# perf —— 时序与矩阵。**这一段是全仓库唯一的一份,型号脚本覆盖不了。**
# 报告要跨机型横向比较,A 机稳定等 15 秒、B 机等 5 秒,两张表放一起就没有
# 意义了 —— 而且这种偏差在报告上完全看不出来。
# ===========================================================================
perf:
  settle_sec: 15             # WAN 拨通后再稳定多久才开测
  duration_sec: 20           # 每一格测多久
  wan_up_timeout_sec: 60     # 等 WAN 拨通最多等多久(超时也照测,但会说)
  bands:      [lan]          # lan / 2GHz / 5GHz —— 换频段记得换注入机
  directions: [up, down, bi] # 上行 / 下行 / 双向
  protocols:  [TCP]          # TCP / UDP / UDP-nofrag(要配 nofrag_bytes)

# ===========================================================================
# run —— 这一轮跑什么
# ===========================================================================
run:
  model: ""                  # 型号脚本名,即 models/<这里>.py。如 Cudy_AX1500
  # 这一轮测哪几档,按这里的顺序跑。默认是四种常见拨号方式。
  # **这台机不支持的、这轮不想测的,自己删掉。** 开跑前会核对:写了这台机
  # 不支持的档会当场拦住,并把它支持哪些列给你看(还没碰路由器)。
  # 某台机才有的档(BUFFALO 的 transix/v6plus/ocnvc/v6connect)也写在这里。
  # 留空 [] = 该型号声明的档全测。
  dial_modes: [dynamic, pppoe, pptp, l2tp]
  headless: false            # true = 不弹浏览器窗口(台架上一般留 false,
                             # 出问题时能亲眼看见它点到哪儿)
  backend: simulate          # simulate = 离线模拟,不碰路由器和仪表,用来验流程
                             # chariot  = 真台架
  reset_mode: dynamic        # 整轮跑完切回哪一档(留空 = 不切回)

report:
  dir: artifacts             # 报告和截图放哪
  title: WAN 性能矩阵        # 报告标题(型号会自动加在文件名里)
