# perf_configs/__MODEL__.yaml —— 这台机的性能测试参数。
#
# 怎么用:把下面写着 FILL_ME 的地方换成**你台架上的真实 IP**,存盘。
# 以后在 start.bat 里选到这台机,就自动用这份文件,不用再动任何别的文件。
# 开跑前工具会把这些参数逐条核一遍,缺什么、配错什么都会当场说,并告诉你
# 改哪一行 —— 所以填不准也不要紧,跑一次就知道了。
#
# 密码不在这里:管理密码和宽带账号在 router.yaml(start.bat 菜单 4 生成,
# git 已忽略)。这份文件只有台架接线,可以进仓库、可以发给同事。

model: __MODEL__

# simulate = 离线模拟(不碰路由器和仪表,用来验流程);chariot = 真台架
backend: chariot

# 测哪几档拨号方式。**整行删掉 = 跑该型号声明的全部档**(推荐)。
# 只想测其中几档 / 换顺序 / 给某档单独塞账号时才写:
# dial_modes:
#   - mode: dynamic
#   - mode: pppoe
#     params: {pppoe_user: xxx, pppoe_pass: yyy}

bands:      [lan]              # lan / 2GHz / 5GHz(换频段不会自动换客户端,见下)
directions: [up, down, bi]     # 上行 / 下行 / 双向
protocols:  [TCP]              # TCP / UDP / UDP-nofrag(不分片,要配 nofrag_bytes)

# 切完一档,等 WAN 真拨通再开测 ---------------------------------------------
wan_up:
  method: ping
  host: FILL_ME                # 默认 ping 谁
  hosts:                       # 按档覆盖:直连档和隧道档的对端在不同网段。
    # 不写这一档 = 用上面的 host;打不通不会失败,但每档白等满 timeout_s。
    dynamic: FILL_ME
  timeout_s: 60
  settle_s: 15                 # 拨通后再稳一会儿

# 台架接线 -------------------------------------------------------------------
chariot:
  duration_s: 20               # 每格测多久(秒)

  # 客户端侧注入机(e1):按频段,每个频段是**各自那台**已经连在该频段上的
  # 电脑。两个频段写同一个 IP = 测了两遍同一条路。
  endpoints:
    lan: FILL_ME

  # 对端(e2)。默认规则是从模式名字猜:dynamic/static 打 public_ip,
  # 其余打 internet_ip。**猜错不会报错,只会给你一份打错了口的漂亮数字**,
  # 所以拿不准就在 e2_ip 里按档写死。
  public_ip:   FILL_ME         # 直连侧对端
  internet_ip: FILL_ME         # 隧道侧对端(pppoe / l2tp / pptp 拨通后)
  e2_ip: {}                    # 按档写死,如 {v6plus: 192.168.202.66}

  scripts:                     # Chariot 脚本
    up:   Throughput.scr
    down: Throughput_w2l.scr
  pairs: {TCP: 50, UDP: 100}   # 每种协议的对数(bi 时上下行各一半)

  # 只有 protocols 里写了 -nofrag 才用得到:各档按自己封装开销算出的 MTU。
  # 没配的档会**直接报错**而不是随便挑一个 —— 猜错的话流量照跑、数字照出,
  # 其实分了片,一份标着"不分片"的分片数据最难发现。
  nofrag_bytes: {}

  stability_ratio: 0.9         # 中段采样 min < 0.9·max 判为"不稳"
  save_tests: true             # 保留 Chariot 的 .tst 原始记录(出争议时要翻)

  # 跑 chariot_perf.py 的解释器。**留空 = 跟本工具同一个 python**
  # (Python 3 的 Chariot 台架就留空)。老台架的 PyChariot 只装在
  # Python 2 里,写它的绝对路径,如 C:\Python26\python.exe
  python: ""

reset_mode: dynamic            # 全部跑完切回哪一档(留空 = 不切回)

report:
  dir: artifacts
  title: WAN 性能矩阵 __MODEL__
