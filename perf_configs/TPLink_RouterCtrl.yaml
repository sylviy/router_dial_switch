# perf_configs/TPLink_RouterCtrl.yaml —— 自家样机(TP-Link,走 RouterCtrl)的
# 性能测试参数。
#
# 这台机和别的型号有一处不一样:**切档也要用这里的 chariot.python**。
# RouterCtrl 只装在台架那个 Python 2.6.5 里,models/TPLink_RouterCtrl.py 靠
# 子进程调 tools/routerctrl_bridge.py,用的就是下面那一行 —— 台架已经为
# Chariot 配好它了,所以不另开第二处。没填的话切档会直接报错说该填哪。
#
# 还写着 FILL_ME 的是我拿不到的(注入机 / 对端 IP),开跑前检查会拦住并指到
# 这里。**密码和样机 IP 不在这里**(在 router.yaml,git 已忽略)。

model: TPLink_RouterCtrl
backend: chariot

# 测哪几档 —— 只有实测接线跑过的这些:
#   * PPPoE 只有"无第二连接"那档;
#   * PPTP / L2TP 只有"第二连接为动态",没有静态的接线;
#   * `_internet` / `_public` 后缀对下发没有影响(桥接里同一支分支),
#     只决定 Chariot 打哪个远端 —— 所以两个都要跑,区别在下面的 hosts/e2_ip。
# static 故意不列:modes.py 里 static 没有字段映射,整轮会切到静态 IP 且不填
# 任何地址(GOTCHAS.md 的 Known gaps)。要测它请手动单跑。
dial_modes:
  - mode: dynamic
  - mode: pppoe
  - mode: pptp_dynamic_internet
  - mode: pptp_dynamic_public
  - mode: l2tp_dynamic_internet
  - mode: l2tp_dynamic_public

bands:      [lan]
directions: [up, down, bi]
protocols:  [TCP]

wan_up:
  method: ping
  host: FILL_ME
  hosts:
    # 拨通与否 ping 谁:`public` 档打直连侧,`internet` 档打隧道侧。
    # 这几行和下面的 e2_ip 是**同一套口径**,别只改一处。
    dynamic:               FILL_ME
    pppoe:                 FILL_ME
    pptp_dynamic_internet:  FILL_ME
    pptp_dynamic_public:    FILL_ME
    l2tp_dynamic_internet:  FILL_ME
    l2tp_dynamic_public:    FILL_ME
  timeout_s: 60
  settle_s: 15

chariot:
  duration_s: 20

  # **切档也用这一行。** 台架上装了 PyChariot + RouterCtrl 的那个 Python 2 的
  # 绝对路径,例:C:\Python26\python.exe。留空 = 回落到当前解释器(py3),
  # 那个跑不了 RouterCtrl —— 所以切档会在开跑前明确报错,不会假装成功。
  # 旧键名 python2: 同样认。
  python: ""

  # 客户端侧注入机(e1):接在被测机 LAN 口上、装了 Chariot Endpoint 的那台。
  endpoints:
    lan: FILL_ME

  public_ip:   FILL_ME     # 直连侧对端
  internet_ip: FILL_ME     # 隧道侧对端

  # 按档写死对端。**别省**:默认规则是从模式名猜路(名字里有 public 就走
  # public_ip,否则 internet_ip)—— 这里的名字刚好带后缀,猜对了是运气,
  # 而猜错不会报错,只会给一份打错了口、数字却很正常的报告。
  e2_ip:
    dynamic:               FILL_ME
    pppoe:                 FILL_ME
    pptp_dynamic_internet:  FILL_ME
    pptp_dynamic_public:    FILL_ME
    l2tp_dynamic_internet:  FILL_ME
    l2tp_dynamic_public:    FILL_ME

report:
  title: TP-Link 自家样机 WAN 拨号方式吞吐对比
